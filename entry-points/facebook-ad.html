<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facebook</title>
<link rel="stylesheet" href="../main.css" />
<style>
  .mock { height: 100%; overflow-y: auto; font-family: helvetica, arial, sans-serif; color: #1c1e21; background: #f0f2f5; }
  .mock__topbar { background: #1877f2; color: #fff; padding: 12px 16px; font-size: 17px; font-weight: 700; }
  .mock__feed { padding: 14px; }
  .post { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .post__head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; }
  .post__avatar { width: 36px; height: 36px; border-radius: 50%; background: #a441bc; flex-shrink: 0; }
  .post__page { font-size: 13px; font-weight: 700; }
  .post__meta { font-size: 11px; color: #65676b; }
  .post__copy { padding: 8px 14px 12px; font-size: 13px; line-height: 1.4; }
  .post__image { height: 180px; background: repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 10px,#e2e8f0 10px,#e2e8f0 20px); }
  .post__cta { display: flex; align-items: center; justify-content: space-between; background: #f0f2f5; padding: 10px 14px; gap: 10px; }
  .post__cta-text { font-size: 11px; color: #65676b; }
  .post__cta-headline { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .post__cta-btn { background: #e4e6eb; border-radius: 6px; padding: 7px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>

  <div class="stage">
    <div class="phone" id="phone">
      <div class="mock">
        <div class="mock__topbar">facebook</div>

        <div class="mock__feed">
          <a class="post" href="../visitor/index.html?start=article">
            <div class="post__head">
              <div class="post__avatar"></div>
              <div>
                <div class="post__page">This is Menopause</div>
                <div class="post__meta">Sponsored</div>
              </div>
            </div>
            <div class="post__copy">Brain fog isn&rsquo;t &ldquo;just stress.&rdquo; See the 34 symptoms most women aren&rsquo;t warned about &mdash; and what actually helps. &#128071;</div>
            <div class="post__image"></div>
            <div class="post__cta">
              <div>
                <div class="post__cta-text">thisismenopause.com</div>
                <div class="post__cta-headline">The 34 Symptoms You Might Not Expect</div>
              </div>
              <div class="post__cta-btn">Learn More</div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="fit-phone.js"></script>
</body>
</html>
